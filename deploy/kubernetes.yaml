apiVersion: apps/v1
kind: Deployment
metadata:
  name: learner-early-warning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: learner-early-warning
  template:
    metadata:
      labels:
        app: learner-early-warning
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: learner-early-warning:1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: OMP_NUM_THREADS
              value: "2"
            - name: OPENBLAS_NUM_THREADS
              value: "2"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: learner-early-warning
spec:
  selector:
    app: learner-early-warning
  ports:
    - name: http
      port: 80
      targetPort: http
